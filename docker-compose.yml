services:
  newsnow:
    build:
      context: .
      args:
        NEWSNOW_DECLARED_REVISION: ${NEWSNOW_DECLARED_REVISION:?set NEWSNOW_DECLARED_REVISION to a full git SHA}
    image: jing-lun/newsnow-airank:${NEWSNOW_DECLARED_REVISION:?set NEWSNOW_DECLARED_REVISION to a full git SHA}
    container_name: newsnow
    ports:
      - '4444:4444'
    volumes:
      - newsnow_data:/usr/app/.data
    environment:
      - HOST=0.0.0.0
      - PORT=4444
      - NODE_ENV=production
      - G_CLIENT_ID=
      - G_CLIENT_SECRET=
      - JWT_SECRET=
      - INIT_TABLE=true
      - ENABLE_CACHE=true
      - NEWSNOW_CACHE_TTL_MS=300000
      - NEWSNOW_SOURCE_INTERVAL_OVERRIDES=cls-telegraph=300000,wallstreetcn-quick=300000,jin10=300000,xueqiu-hotstock=300000,gelonghui=300000,fastbull-express=300000,zhihu=300000,ithome=600000,zaobao=1800000
      - NEWSNOW_DECLARED_REVISION=${NEWSNOW_DECLARED_REVISION:?set NEWSNOW_DECLARED_REVISION to a full git SHA}
      - PRODUCTHUNT_API_TOKEN=

volumes:
  newsnow_data:
    name: newsnow_data
